name: Validador Maestro V2

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: 

jobs:
  qa_auto:
    runs-on: ubuntu-latest
    env:
      # Garante que a raiz do projeto seja o ponto de partida para os imports
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: 📥 Baixando Codigo
        uses: actions/checkout@v4

      - name: 🐍 Preparando Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Instalando Dependencias
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: 🏗️ Preparando Estrutura (Touch Condicional)
        run: |
          mkdir -p src/modules src/database tests data
          [ -f src/__init__.py ] || touch src/__init__.py
          [ -f src/modules/__init__.py ] || touch src/modules/__init__.py
          [ -f src/database/__init__.py ] || touch src/database/__init__.py

      # --- NOVO STEP DE DEBUG ---
      # Isso vai imprimir no log do GitHub exatamente quais arquivos estão na pasta
      - name: 🔍 Debug - Verificando arquivos reais no runner
        run: |
          echo "=== Listando arquivos na pasta src/modules/ ==="
          ls -la src/modules/ || echo "Pasta não encontrada"
          echo "==============================================="

      - name: 🤖 Criando Teste de Validação (Limpo)
        run: |
          cat <<'EOF' > tests/test_auto.py
          import pytest
          import os
          from src.modules.cliente import cadastrar_cliente
          from src.database.connection import create_tables

          def test_fluxo_total():
              os.makedirs('data', exist_ok=True)
              create_tables()
              # Teste de Cadastro
              assert cadastrar_cliente('Diretor Auto', '11999998888') == True
              # Teste de Duplicidade
              res = cadastrar_cliente('Outro', '11999998888')
              assert 'já está cadastrado' in str(res)
          EOF

      - name: 🚀 Executando QA Profissional
        run: python -m pytest tests/test_auto.py -v
