name: Validador Maestro V2

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  qa_auto:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Baixando Codigo
        uses: actions/checkout@v4

      - name: 🐍 Preparando Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Instalando Dependencias
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: 🤖 Rodando QA Automatico
        run: |
          mkdir -p tests
          cat <<EOF > tests/test_auto.py
          import pytest
          from src.modules.cliente import cadastrar_cliente
          from src.database.connection import create_tables
          import os

          def test_fluxo_total():
              # Força a criação da pasta data no ambiente do Robô
              os.makedirs("data", exist_ok=True)
              create_tables()
              assert cadastrar_cliente("Diretor Auto", "11999998888") == True
              res = cadastrar_cliente("Outro", "11999998888")
              assert "já está cadastrado" in str(res)
          EOF
          # O Pulo do Gato: PYTHONPATH=. diz ao Python para enxergar a pasta 'src'
          PYTHONPATH=. pytest tests/test_auto.py -v          EOF
          pytest tests/test_auto.py -v
