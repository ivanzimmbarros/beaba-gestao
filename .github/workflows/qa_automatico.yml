name: Validador Maestro V2

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: # ESTA LINHA LIBERA O BOTÃO DE EXECUÇÃO MANUAL

jobs:
  qa_auto:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Baixando Codigo
        uses: actions/checkout@v4

      - name: 🐍 Preparando Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Instalando Dependencias
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: 🤖 Criando Teste de Validação
        run: |
          mkdir -p tests
          echo "import pytest
          from src.modules.cliente import cadastrar_cliente
          from src.database.connection import create_tables
          import os

          def test_fluxo_total():
              os.makedirs('data', exist_ok=True)
              create_tables()
              assert cadastrar_cliente('Diretor Auto', '11999998888') == True
              res = cadastrar_cliente('Outro', '11999998888')
              assert 'já está cadastrado' in str(res)" > tests/test_auto.py

      - name: 🚀 Executando QA
        run: |
          PYTHONPATH=. pytest tests/test_auto.py -v
