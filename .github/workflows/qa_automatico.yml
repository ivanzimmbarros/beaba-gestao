name: Validador Maestro V2

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: # LIBERA O BOTÃO MANUAL (AGORA VAI APARECER)

jobs:
  qa_auto:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Baixando Codigo
        uses: actions/checkout@v4

      - name: 🐍 Preparando Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Instalando Dependencias
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: 🏗️ Preparando Estrutura de Módulos
        run: |
          # Cria arquivos sinalizadores para o Python não se perder
          touch src/__init__.py
          touch src/modules/__init__.py
          touch src/database/__init__.py
          mkdir -p tests

      - name: 🤖 Criando Teste de Validação
        run: |
          cat <<'EOF' > tests/test_auto.py
          import pytest
          import os
          import sys
          # Força o caminho da raiz no sistema
          sys.path.append(os.path.abspath(os.path.join(os.path.dirname(__file__), '..')))

          from src.modules.cliente import cadastrar_cliente
          from src.database.connection import create_tables

          def test_fluxo_total():
              os.makedirs('data', exist_ok=True)
              create_tables()
              # Teste de Cadastro
              assert cadastrar_cliente('Diretor Auto', '11999998888') == True
              # Teste de Duplicidade
              res = cadastrar_cliente('Outro', '11999998888')
              assert 'já está cadastrado' in str(res)
          EOF

      - name: 🚀 Executando QA Blindado
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          python3 -m pytest tests/test_auto.py -v
