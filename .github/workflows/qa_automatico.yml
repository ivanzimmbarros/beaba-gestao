name: Validador Maestro V2

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: 

jobs:
  qa_auto:
    runs-on: ubuntu-latest
    # CORREÇÃO 1: PYTHONPATH global para o Python nunca mais se perder
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: 📥 Baixando Codigo
        uses: actions/checkout@v4

      - name: 🐍 Preparando Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Instalando Dependencias
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: 🏗️ Preparando Estrutura (Touch Condicional)
        run: |
          # CORREÇÃO 2: Garante pastas e __init__.py sem apagar o que já existe
          mkdir -p src/modules src/database tests data
          [ -f src/__init__.py ] || touch src/__init__.py
          [ -f src/modules/__init__.py ] || touch src/modules/__init__.py
          [ -f src/database/__init__.py ] || touch src/database/__init__.py

      - name: 🔍 Verificação de Sanidade (Log de Segurança)
        run: |
          echo "=== ARQUIVOS DETECTADOS NO MÓDULO CLIENTE ==="
          ls -la src/modules/
          if [ ! -f src/modules/cliente.py ]; then
            echo "🚨 ALERTA: O arquivo cliente.py NÃO FOI ENCONTRADO no repositório!"
          fi

      - name: 🤖 Criando Teste de Validação (Limpo)
        run: |
          # CORREÇÃO 3: Import direto e limpo
          cat <<'EOF' > tests/test_auto.py
          import pytest
          import os
          from src.modules.cliente import cadastrar_cliente
          from src.database.connection import create_tables

          def test_fluxo_total():
              os.makedirs('data', exist_ok=True)
              create_tables()
              # Validação de Cadastro
              assert cadastrar_cliente('Diretor Auto', '11999998888') == True
              # Validação de Duplicidade
              res = cadastrar_cliente('Outro', '11999998888')
              assert 'já está cadastrado' in str(res)
          EOF

      - name: 🚀 Executando QA Profissional
        run: python3 -m pytest tests/test_auto.py -v
