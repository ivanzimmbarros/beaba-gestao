# E17.2 — Backup semanal (domingo 00:00 UTC). Push: branch tocada. Cron/dispatch: três branches em paralelo.

name: backup_weekly

on:
  push:
    branches:
      - develop
      - staging
      - main
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

concurrency:
  group: beaba-backup-weekly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  prep-matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - id: set
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 << 'PY'
          import json
          import os

          def env_for(ref: str) -> str:
              return {"main": "production", "staging": "staging"}.get(ref, "develop")

          e = os.environ["EVENT_NAME"]
          out = open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8")
          if e == "push":
              ref = os.environ["REF_NAME"]
              inc = [{"target_branch": ref, "environment_name": env_for(ref)}]
          else:
              inc = [
                  {"target_branch": "develop", "environment_name": "develop"},
                  {"target_branch": "staging", "environment_name": "staging"},
                  {"target_branch": "main", "environment_name": "production"},
              ]
          out.write("include=" + json.dumps(inc) + "\n")
          out.close()
          PY

  backup:
    needs: prep-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prep-matrix.outputs.include) }}
    uses: ./.github/workflows/backup_encrypt_callable.yml
    secrets: inherit
    with:
      target_branch: ${{ matrix.target_branch }}
      environment_name: ${{ matrix.environment_name }}
      artifact_name: DB_WEEKLY_BACKUP-${{ matrix.target_branch }}
      retention_days: 30
      retention_label: "WEEKLY (30d)"

  notify-failure:
    needs: [prep-matrix, backup]
    if: always() && (needs.backup.result == 'failure')
    runs-on: ubuntu-latest
    environment: ${{ (github.ref_name == 'main' && 'production') || (github.ref_name == 'staging' && 'staging') || 'develop' }}
    steps:
      - uses: actions/checkout@v4

      - name: Hora UTC
        id: utc
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Preparar e-mail de falha (resumo + HTML)
        run: |
          python3 scripts/gha_email_backup_alarm.py \
            --tier weekly \
            --ts "${{ steps.utc.outputs.ts }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --run-id "${{ github.run_id }}"

      - name: E-mail — falha de backup semanal
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🔴 FALHA | Backup WEEKLY | ${{ steps.utc.outputs.ts }} | ver Actions"
          to: ivanzimmbarros@gmail.com
          from: ${{ secrets.EMAIL_FROM }}
          body: file://gha_backup_fail_plain.txt
          html_body: file://gha_backup_fail_body.html
