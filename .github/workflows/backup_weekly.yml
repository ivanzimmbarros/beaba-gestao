# E17.2 — Backup semanal (domingo 00:00 UTC), artefacto DB_WEEKLY_BACKUP, retenção 30 dias.
# Usa o mesmo job reutilizável que backup_hourly / backup_daily (`backup_encrypt_callable.yml`):
# pipeline Python, rebase antes do commit de telemetria, gate BEA1 + upload. Telemetria em develop.

name: backup_weekly

on:
  push:
    branches:
      - develop
      - staging
      - main
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

concurrency:
  group: beaba-backup-weekly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  backup:
    uses: ./.github/workflows/backup_encrypt_callable.yml
    secrets: inherit
    with:
      environment_name: ${{ (github.ref_name == 'main' && 'production') || (github.ref_name == 'staging' && 'staging') || 'develop' }}
      artifact_name: DB_WEEKLY_BACKUP
      retention_days: 30
      retention_label: "WEEKLY (30d)"
      telemetry_git_branch: develop

  notify-failure:
    needs: backup
    if: failure()
    runs-on: ubuntu-latest
    environment: ${{ (github.ref_name == 'main' && 'production') || (github.ref_name == 'staging' && 'staging') || 'develop' }}
    steps:
      - name: Hora UTC
        id: utc
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: E-mail — falha de backup semanal
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "(Atenção) Falha de Execucao de Backup - BeaBa"
          to: ivanzimmbarros@gmail.com
          from: ${{ secrets.EMAIL_FROM }}
          body: |
            Falha no workflow backup_weekly (DB_WEEKLY_BACKUP, retenção 30d).

            Hora (UTC): ${{ steps.utc.outputs.ts }}
            Etapa provável: «Pipeline backup + encriptação», upload do artefacto ou commit de telemetria (ver run).
            Log / run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
