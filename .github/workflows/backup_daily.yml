# E17.2 — Backup diário 00:00 UTC, artefacto DB_DAILY_BACKUP, retenção 7 dias.
# Usa o mesmo job reutilizável que backup_hourly (`backup_encrypt_callable.yml`): pipeline Python,
# rebase antes do commit de telemetria, gate BEA1 + upload. Telemetria em `telemetry_git_branch` (= develop).
# Push em `develop`, `staging`, `main`. Cron diário: só na branch por defeito do repo.

name: backup_daily

on:
  push:
    branches:
      - develop
      - staging
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: beaba-backup-daily-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  backup:
    uses: ./.github/workflows/backup_encrypt_callable.yml
    secrets: inherit
    with:
      environment_name: ${{ (github.ref_name == 'main' && 'production') || (github.ref_name == 'staging' && 'staging') || 'develop' }}
      artifact_name: DB_DAILY_BACKUP
      retention_days: 7
      retention_label: "DAILY (7d)"
      telemetry_git_branch: develop

  notify-failure:
    needs: backup
    if: failure()
    runs-on: ubuntu-latest
    environment: ${{ (github.ref_name == 'main' && 'production') || (github.ref_name == 'staging' && 'staging') || 'develop' }}
    steps:
      - name: Hora UTC
        id: utc
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: E-mail — falha de backup diário
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "(Atenção) Falha de Execucao de Backup - BeaBa"
          to: ivanzimmbarros@gmail.com
          from: ${{ secrets.EMAIL_FROM }}
          body: |
            Falha no workflow backup_daily (DB_DAILY_BACKUP, retenção 7d).

            Hora (UTC): ${{ steps.utc.outputs.ts }}
            Etapa provável: «Pipeline backup + encriptação», upload do artefacto ou commit de telemetria (ver run).
            Log / run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
