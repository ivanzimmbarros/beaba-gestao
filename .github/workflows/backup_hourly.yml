# E17.2 — Backup horário (UTC). Push: só a branch alterada. Cron/dispatch: desenvolve, staging e main em paralelo.
# Telemetria: backup_dr_history.json em **cada** branch (estruturas independentes).
# Agendamento `schedule`: o workflow corre na branch por defeito do repo; a matriz abaixo executa os três refs alvo.

name: backup_hourly

on:
  push:
    branches:
      - develop
      - staging
      - main
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [backup_hourly_keepalive]

concurrency:
  group: beaba-backup-telemetry-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  prep-matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - id: set
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 << 'PY'
          import json
          import os

          def env_for(ref: str) -> str:
              return {"main": "production", "staging": "staging"}.get(ref, "develop")

          e = os.environ["EVENT_NAME"]
          out = open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8")
          if e == "push":
              ref = os.environ["REF_NAME"]
              inc = [{"target_branch": ref, "environment_name": env_for(ref)}]
          else:
              inc = [
                  {"target_branch": "develop", "environment_name": "develop"},
                  {"target_branch": "staging", "environment_name": "staging"},
                  {"target_branch": "main", "environment_name": "production"},
              ]
          out.write("include=" + json.dumps(inc) + "\n")
          out.close()
          PY

  backup:
    needs: prep-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prep-matrix.outputs.include) }}
    uses: ./.github/workflows/backup_encrypt_callable.yml
    secrets: inherit
    with:
      target_branch: ${{ matrix.target_branch }}
      environment_name: ${{ matrix.environment_name }}
      artifact_name: beaba-sqlite-backup-encrypted-${{ matrix.target_branch }}
      retention_days: 3
      retention_label: "HOURLY (3d)"

  notify-failure:
    needs: [prep-matrix, backup]
    if: always() && (needs.backup.result == 'failure')
    runs-on: ubuntu-latest
    environment: ${{ (github.ref_name == 'main' && 'production') || (github.ref_name == 'staging' && 'staging') || 'develop' }}
    steps:
      - name: Hora UTC
        id: utc
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: E-mail — falha de backup
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "(Atenção) Falha de backup HOURLY (BeaBa) — ver matriz no Actions"
          to: ivanzimmbarros@gmail.com
          from: ${{ secrets.EMAIL_FROM }}
          body: |
            Falha no workflow backup_hourly (matrix: develop / staging / main no agendamento; uma branch no push).

            Hora (UTC): ${{ steps.utc.outputs.ts }}
            Origem do e-mail: job «notify-failure» em backup_hourly.yml após falha do job reutilizável.

            Ver qual célula da matriz falhou: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Passos com prefixo [backup_encrypt_callable / Gate] e notices no sumário do job indicam a branch.
