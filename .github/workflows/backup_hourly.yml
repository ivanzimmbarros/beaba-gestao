# E17.2 — Backup horário (UTC): retenção 3 dias. Chama workflow reutilizável.
# E-mail em falha: Secrets EMAIL_* (ver PAINEL).

name: backup_hourly

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: beaba-backup-telemetry-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  backup:
    uses: ./.github/workflows/backup_encrypt_callable.yml
    secrets: inherit
    with:
      artifact_name: beaba-sqlite-backup-encrypted
      retention_days: 3
      retention_label: "HOURLY (3d)"

  notify-failure:
    needs: backup
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Hora UTC
        id: utc
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: E-mail — falha de backup
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "(Atenção) Falha de Execucao de Backup - BeaBa"
          to: ivanzimmbarros@gmail.com
          from: ${{ secrets.EMAIL_FROM }}
          body: |
            Falha no workflow backup_hourly (HOURLY, retenção 3d).

            Hora (UTC): ${{ steps.utc.outputs.ts }}
            Etapa provável: «Pipeline backup + encriptação» ou «Upload artefacto» (ver run).
            Log / run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
