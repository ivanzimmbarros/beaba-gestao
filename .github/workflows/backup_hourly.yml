# E17.2 — Backup horário (UTC): retenção 3 dias. Chama workflow reutilizável.
# E-mail em falha: Secrets EMAIL_* (ver PAINEL).
# Reindexação 2026-04-19 (E17.1): cron deslocado para o minuto :37 UTC — a documentação GitHub
# indica que disparos no minuto :00 concentram carga e podem falhar ou atrasar; :37 reduz colisão.
#
# E17.1 — O *evento* do run pode aparecer em `main` (cron na branch por defeito). O *commit* de
# telemetria é sempre em `telemetry_git_branch` (= develop). Comando local: `git pull origin develop`.

name: backup_hourly

on:
  push:
    branches:
      - develop
      - staging
      - main
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [backup_hourly_keepalive]

concurrency:
  group: beaba-backup-telemetry-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  backup:
    uses: ./.github/workflows/backup_encrypt_callable.yml
    secrets: inherit
    with:
      artifact_name: beaba-sqlite-backup-encrypted
      retention_days: 3
      retention_label: "HOURLY (3d)"
      telemetry_git_branch: develop

  notify-failure:
    needs: backup
    if: failure()
    runs-on: ubuntu-latest
    environment: ${{ (github.ref_name == 'main' && 'production') || (github.ref_name == 'staging' && 'staging') || 'develop' }}
    steps:
      - name: Hora UTC
        id: utc
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: E-mail — falha de backup
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "(Atenção) Falha de Execucao de Backup - BeaBa"
          to: ivanzimmbarros@gmail.com
          from: ${{ secrets.EMAIL_FROM }}
          body: |
            Falha no workflow backup_hourly (HOURLY, retenção 3d).

            Hora (UTC): ${{ steps.utc.outputs.ts }}
            Etapa provável: «Pipeline backup + encriptação» ou «Upload artefacto» (ver run).
            Log / run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
