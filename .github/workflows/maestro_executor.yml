name: Maestro Executor
on:
  workflow_dispatch:
    inputs:
      tipo:
        description: 'comment ou issue'
        default: 'comment'
      numero:
        description: 'ID da Issue'
        default: '1'
      conteudo:
        description: 'Texto'
        required: true

jobs:
  executar:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Entrar no Repositório
        uses: actions/checkout@v4  # ESTA LINHA É A SOLUÇÃO

      - name: Postar no GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh issue comment "${{ github.event.inputs.numero }}" --body "${{ github.event.inputs.conteudo }}"
