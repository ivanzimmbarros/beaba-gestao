name: Maestro Executor
on:
  workflow_dispatch:
    inputs:
      tipo:
        description: 'comment ou issue'
        default: 'comment'
      numero:
        description: 'ID da Issue'
        default: '1'
      conteudo:
        description: 'Texto'
        required: true

jobs:
  executar:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Postar via API
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/issues/${{ github.event.inputs.numero }}/comments \
            -f body="${{ github.event.inputs.conteudo }}"
