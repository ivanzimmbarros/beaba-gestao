name: Maestro Executor (Escrita Automática)
on:
  workflow_dispatch:
    inputs:
      tipo:
        description: 'Tipo de ação (issue ou comment)'
        required: true
      numero:
        description: 'Número da Issue (se for comentário)'
        required: false
      conteudo:
        description: 'Texto que a IA gerou'
        required: true

jobs:
  executar:
    runs-on: ubuntu-latest
    steps:
      - name: Postar no GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.tipo }}" == "comment" ]; then
            gh issue comment ${{ github.event.inputs.numero }} --body "${{ github.event.inputs.conteudo }}"
          else
            gh issue create --title "PARECER TÉCNICO" --body "${{ github.event.inputs.conteudo }}"
          fi
