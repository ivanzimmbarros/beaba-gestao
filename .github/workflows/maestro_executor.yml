name: Maestro Executor
on:
  workflow_dispatch:
    inputs:
      tipo:
        description: 'comment ou issue'
        default: 'comment'
      numero:
        description: 'ID da Issue'
        default: '1'
      conteudo:
        description: 'Texto'
        required: true

jobs:
  executar:
    runs-on: ubuntu-latest
    steps:
      - name: Postar no GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.tipo }}" == "comment" ]; then
            gh issue comment ${{ github.event.inputs.numero }} --body "${{ github.event.inputs.conteudo }}"
          else
            gh issue create --title "PARECER TÉCNICO" --body "${{ github.event.inputs.conteudo }}"
          fi
