name: Maestro V3
on:
  workflow_dispatch:
    inputs:
      numero:
        description: 'Nome do Arquivo (ex: app.py)'
      coluna:
        description: 'Tipo: FILE ou COMENTARIO'
        default: 'FILE'
      conteudo:
        description: 'Cole o código aqui'
        required: true

jobs:
  executar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Criar Arquivo Blindado
        shell: bash
        env:
          CODIGO_BRUTO: ${{ github.event.inputs.conteudo }}
        run: |
          git config --global user.name "Maestro Bot"
          git config --global user.email "bot@beaba.com"
          
          if [ "${{ github.event.inputs.coluna }}" == "FILE" ]; then
            mkdir -p "$(dirname "${{ github.event.inputs.numero }}")"
            # O segredo: usamos a variável de ambiente para preservar as quebras de linha
            printf "%s" "$CODIGO_BRUTO" > "${{ github.event.inputs.numero }}"
            
            git add .
            git commit -m "📦 Maestro: Refatorando ${{ github.event.inputs.numero }}"
            git push
          fi
