name: Maestro V2 (Turbo)
on:
  workflow_dispatch:
    inputs:
      numero:
        description: 'ID da Issue ou Nome do Arquivo'
        default: '1'
      coluna:
        description: 'Tipo: FILE ou ANALISTA, ARQUITETO, DEV, QA'
        default: 'ANALISTA'
      conteudo:
        description: 'Texto ou Conteúdo do Código'
        required: true

jobs:
  executar:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
    steps:
      - name: Entrar no Repositório
        uses: actions/checkout@v4

      - name: Configurar Robô
        run: |
          git config --global user.name "Maestro Bot"
          git config --global user.email "bot@beaba.com"

      - name: Processar Ordem
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.coluna }}" == "FILE" ]; then
            # CRIAÇÃO DE ARQUIVO E PASTAS
            mkdir -p "$(dirname "${{ github.event.inputs.numero }}")"
            echo "${{ github.event.inputs.conteudo }}" > "${{ github.event.inputs.numero }}"
            git add .
            git commit -m "📦 Maestro: Criando ${{ github.event.inputs.numero }}"
            git push
          else
            # POSTAR COMENTÁRIO NA ISSUE
            gh issue comment "${{ github.event.inputs.numero }}" --body "${{ github.event.inputs.conteudo }}"
            
            # ATUALIZAR PAINEL NO README (OPCIONAL)
            # Aqui você pode manter a lógica de sed se seu README já tiver a tabela
            git add README.md || echo "Sem README"
            git commit -m "📊 Painel Atualizado: #${{ github.event.inputs.numero }}" || echo "Nada para mudar"
            git push || echo "Nada para subir"
          fi
