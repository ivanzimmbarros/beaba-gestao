name: Maestro V2
on:
  workflow_dispatch:
    inputs:
      numero:
        description: 'ID da Issue'
        default: '1'
      conteudo:
        description: 'Texto'
        required: true

jobs:
  executar:
    runs-on: ubuntu-latest
    steps:
      - name: Postar via API
        run: |
          curl -X POST \
          -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.inputs.numero }}/comments \
          -d "{\"body\":\"${{ github.event.inputs.conteudo }}\"}"
