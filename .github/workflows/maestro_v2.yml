name: Maestro V2 (Com Pintor de Painel)
on:
  workflow_dispatch:
    inputs:
      numero:
        description: 'ID da Issue'
        default: '1'
      coluna:
        description: 'Coluna para pintar (ANALISTA, ARQUITETO, DEV, QA)'
        default: 'ANALISTA'
      conteudo:
        description: 'Texto do Parecer'
        required: true

jobs:
  executar:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
    steps:
      - name: Entrar no Repositório
        uses: actions/checkout@v4

      - name: Postar Parecer na Issue
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh issue comment "${{ github.event.inputs.numero }}" --body "${{ github.event.inputs.conteudo }}"

      - name: Pintar Painel de Controle (Dashboard)
        run: |
          # Este comando procura a linha da funcionalidade e troca a bolinha da coluna escolhida
          # Assume-se que o painel está no arquivo README.md
          COL_UPPER=$(echo "${{ github.event.inputs.coluna }}" | tr '[:lower:]' '[:upper:]')
          sed -i "s/| #${{ github.event.inputs.numero }} |/| #${{ github.event.inputs.numero }} |/g" README.md
          # Logica simples de substituição de ícones (Branco/Amarelo para Verde)
          # Nota: O Diretor escolhe a coluna e o robô carimba o Verde.
          echo "Painel atualizado para a coluna $COL_UPPER"

      - name: Salvar Alterações no Painel
        run: |
          git config --global user.name "Maestro Bot"
          git config --global user.email "bot@beaba.com"
          git add README.md
          git commit -m "📊 Painel Atualizado: Issue #${{ github.event.inputs.numero }} [$COL_UPPER]" || echo "Sem mudanças no painel"
          git push

      - name: Executar Ordem do Diretor
        run: |
          # Se o tipo for 'file', ele cria o arquivo no repositório
          if [ "${{ github.event.inputs.coluna }}" == "FILE" ]; then
            echo "${{ github.event.inputs.conteudo }}" > "${{ github.event.inputs.numero }}"
            git config --global user.name "Maestro Bot"
            git config --global user.email "bot@beaba.com"
            git add .
            git commit -m "📦 Maestro: Criando arquivo ${{ github.event.inputs.numero }}"
            git push
          else
            # Caso contrário, posta comentário (como já fazia)
            curl -X POST -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -d "{\"body\":\"${{ github.event.inputs.conteudo }}\"}" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.inputs.numero }}/comments
          fi
