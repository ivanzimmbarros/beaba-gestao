name: Maestro V2 (Turbo)
on:
  workflow_dispatch:
    inputs:
      numero:
        description: 'Nome do Arquivo'
      coluna:
        description: 'Tipo: FILE ou COMENTARIO'
        default: 'FILE'
      conteudo:
        description: 'Conteúdo'
        required: true

jobs:
  executar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Processar Arquivo (Anti-Achatamento)
        if: github.event.inputs.coluna == 'FILE'
        env:
          CONTEUDO: ${{ github.event.inputs.conteudo }}
        run: |
          git config --global user.name "Maestro Bot"
          git config --global user.email "bot@beaba.com"
          
          mkdir -p "$(dirname "${{ github.event.inputs.numero }}")"
          # Decodifica o código secreto "|||" para quebras de linha reais
          printf "%s" "$CONTEUDO" | sed 's/|||/\n/g' > "${{ github.event.inputs.numero }}"
          
          git add .
          git commit -m "📦 Maestro: Deploy Estruturado de ${{ github.event.inputs.numero }}"
          git push

      - name: Processar Comentario
        if: github.event.inputs.coluna != 'FILE'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh issue comment "${{ github.event.inputs.numero }}" --body "${{ github.event.inputs.conteudo }}"
