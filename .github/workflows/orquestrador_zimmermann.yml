name: "Fábrica Zimmermann: Fluxo de 13 Etapas"
on:
  push:
    branches: [ develop ]
  workflow_dispatch:
    inputs:
      demanda:
        description: 'Demanda do Analista'
        required: true
jobs:
  planejamento:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Etapas 1-5: Registro e Desenho"
        run: |
          mkdir -p docs/workflow/pareceres
          echo "Parecer Analista: Iniciado" > docs/workflow/pareceres/parecer_analista.md
  desenvolvimento:
    needs: planejamento
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Etapas 6-8: Codificação e Arquiteto"
        run: echo "Parecer Arquiteto: Validado" > docs/workflow/pareceres/parecer_arquiteto.md
  qa_massivo:
    needs: desenvolvimento
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Etapas 11-13: Testes e Regressão"
        run: echo "QA: Aprovado"
