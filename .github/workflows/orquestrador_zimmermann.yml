name: "Fábrica Zimmermann: Governança de 15 Etapas"

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  planejamento_diretoria:
    name: "1-4: Analista & Diretor"
    runs-on: ubuntu-latest
    steps:
      - name: "Registro e Confirmacao"
        run: echo "Etapas 1-4 concluídas."

  arquitetura_logica:
    name: "5-7: Arquiteto & Analista"
    needs: planejamento_diretoria
    runs-on: ubuntu-latest
    steps:
      - name: "Desenho Logico"
        run: echo "Etapas 5-7 concluídas."

  desenvolvimento_tecnico:
    name: "8-10: Dev & Arquiteto"
    needs: arquitetura_logica
    runs-on: ubuntu-latest
    steps:
      - name: "Codificacao"
        run: echo "Etapas 8-10 concluídas."

  homologacao_negocio:
    name: "11-13: Analista & Plano Testes"
    needs: desenvolvimento_tecnico
    runs-on: ubuntu-latest
    steps:
      - name: "Validacao Final Analista"
        run: echo "Etapas 11-13 concluídas."

  qa_validacao_final:
    name: "14-15: QA Massivo"
    needs: homologacao_negocio
    runs-on: ubuntu-latest
    steps:
      - name: "Testes e Regressao"
        run: echo "Etapas 14-15 concluídas."
