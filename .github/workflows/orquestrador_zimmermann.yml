name: "Fábrica Zimmermann: Fluxo de 13 Etapas"

on:
  push:
    branches: [ develop ]
  workflow_dispatch:
    inputs:
      demanda:
        description: 'Descrição da Demanda do Analista'
        required: true

jobs:
  # ETAPAS 1 A 5: DESENHO E VALIDAÇÃO FUNCIONAL/LÓGICA
  planejamento:
    runs-on: ubuntu-latest
    steps:
      - name: "Etapa 1 a 5: Registro e Validação de Desenho"
        run: |
          echo "Status: Analista registrou demanda e validou desenho lógico do Arquiteto."
          echo "Parecer Analista: Aprovado para Codificação" > docs/workflow/pareceres/parecer_analista_funcional.md

  # ETAPA 6 A 8: CODIFICAÇÃO E VALIDAÇÃO DO ARQUITETO
  desenvolvimento:
    needs: planejamento
    runs-on: ubuntu-latest
    steps:
      - name: "Etapa 6 a 8: Codificação e Parecer do Arquiteto"
        run: |
          echo "Status: Dev codificou e Arquiteto validou o código."
          echo "Parecer Arquiteto: Código segue padrões de arquitetura." > docs/workflow/pareceres/parecer_arquiteto_tecnico.md

  # ETAPA 9 A 10: VALIDAÇÃO FINAL DO ANALISTA ANTES DO QA
  homologacao_pre_qa:
    needs: desenvolvimento
    runs-on: ubuntu-latest
    steps:
      - name: "Etapa 9 a 10: Analista autoriza envio para QA"
        run: |
          echo "Status: Analista revisou parecer do Arquiteto e autorizou QA."

  # ETAPA 11 A 13: QA E VALIDAÇÃO MASSIVA (REGRESSÃO)
  qa_massivo:
    needs: homologacao_pre_qa
    runs-on: ubuntu-latest
    steps:
      - name: "Etapa 11 a 12: Testes Massivos e Regressão"
        run: |
          echo "Executando testes em funções antigas e novas..."
          # Aqui o sistema roda o pytest. Se falhar, o job morre e sinaliza erro total.
          python3 -m pytest tests/test_auto.py
          
      - name: "Etapa 13: Confirmação de Aprovação Total"
        if: success()
        run: echo "Status: QA aprovou. Código pronto para produção."

      - name: "FLUXO DE FALHA: Reinício Obrigatório"
        if: failure()
        run: |
          echo "ERRO DETECTADO EM QA OU VALIDAÇÃO."
          echo "Ação: Invalidação de etapas anteriores iniciada. Retornando ao Analista."
          exit 1
