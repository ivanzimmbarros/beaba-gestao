name: "Fábrica Zimmermann: Fluxo de 13 Etapas"

on:
  push:
    branches: [ develop ]
  workflow_dispatch:
    inputs:
      demanda:
        description: 'Demanda do Analista'
        required: true

jobs:
  planejamento:
    name: "Etapas 1-5: Planejamento"
    runs-on: ubuntu-latest
    steps:
      - name: "Registro e Desenho"
        run: echo "Iniciando fluxo de 13 etapas..."

  desenvolvimento:
    name: "Etapas 6-10: Dev e Homologação"
    needs: planejamento
    runs-on: ubuntu-latest
    steps:
      - name: "Codificação e Pareceres"
        run: echo "Aguardando parecer do arquiteto..."

  qa_massivo:
    name: "Etapas 11-13: QA e Aprovação"
    needs: desenvolvimento
    runs-on: ubuntu-latest
    steps:
      - name: "Testes de Regressão"
        run: echo "Executando testes massivos..."
