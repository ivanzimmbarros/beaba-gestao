name: Auditoria do Analista
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gerar Relatório para o Analista
        run: |
          echo "### 🔍 RELATÓRIO DE ALTERAÇÕES PARA O ANALISTA" > audit_report.txt
          echo "**Autor:** ${{ github.actor }}" >> audit_report.txt
          echo "**Commit:** ${{ github.sha }}" >> audit_report.txt
          echo "---" >> audit_report.txt
          echo "#### 📄 ARQUIVOS ALTERADOS:" >> audit_report.txt
          EMPTY_TREE=4b825dc642cb6eb9a060e54bf8d69288fbee4904
          if PARENT=$(git rev-parse HEAD^ 2>/dev/null); then
            git diff --name-only "$PARENT" HEAD >> audit_report.txt
            echo "---" >> audit_report.txt
            echo "#### 🛠️ DIFF DE CÓDIGO (RESUMO):" >> audit_report.txt
            git diff "$PARENT" HEAD --unified=0 >> audit_report.txt
          else
            echo "ℹ️ Sem HEAD^ — comparação contra árvore vazia." >> audit_report.txt
            git diff --name-only "$EMPTY_TREE" HEAD >> audit_report.txt
            echo "---" >> audit_report.txt
            echo "#### 🛠️ DIFF DE CÓDIGO (RESUMO):" >> audit_report.txt
            git diff "$EMPTY_TREE" HEAD --unified=0 >> audit_report.txt
          fi

          cat audit_report.txt
