# E17.2 — Workflow reutilizável: backup SQLite + encriptação + telemetria + commit na branch de governança.
# Chamado por backup_hourly / backup_daily / backup_weekly.
# Token: usar sempre github.token (GITHUB_TOKEN automático). secrets.GITHUB_TOKEN é inválido
# excepto se existir secret manual com esse nome — deixa checkout/push sem credencial.
#
# O run do GitHub pode listar `main` (workflow na branch por defeito); checkout + push da telemetria
# usam sempre `inputs.telemetry_git_branch` (defeito: develop).
#
# Secret obrigatório (nível repositório): BEABA_BACKUP_KEY — base64 de 32 bytes ou hex 64 chars.
# Não é GPG; é AES-256-GCM (scripts/e17_1_crypto.py). Sem este secret, encrypted_path fica vazio e o gate falha.

on:
  workflow_call:
    inputs:
      environment_name:
        description: "GitHub Environment a usar para secrets (production|staging|develop)."
        required: false
        type: string
        default: develop
      artifact_name:
        required: true
        type: string
      retention_days:
        required: true
        type: number
      retention_label:
        required: true
        type: string
      telemetry_git_branch:
        description: "Branch de governança — JSON telemetria (Monitor: git pull nesta branch)."
        required: false
        type: string
        default: develop
    secrets:
      BEABA_BACKUP_KEY:
        required: true

permissions:
  contents: write
  actions: write

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name || 'develop' }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
      actions: write
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}
      BEABA_REPO_ROOT: ${{ github.workspace }}
      BEABA_BACKUP_CLOUD_QUEUE: "0"
      BEABA_BACKUP_KEEP: "50"
      BEABA_CI_PREPARE_EMPTY_DB: "1"
      BEABA_GHA_RETENTION_LABEL: ${{ inputs.retention_label }}
      BEABA_GHA_ARTIFACT_NAME: ${{ inputs.artifact_name }}
      BEABA_BACKUP_KEY: ${{ secrets.BEABA_BACKUP_KEY }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}

    steps:
      - name: Checkout branch de governança (telemetria)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.telemetry_git_branch }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: pip install -r requirements.txt

      - name: Pipeline backup + encriptação
        id: pipe
        continue-on-error: false
        run: python scripts/e17_1_gha_backup_job.py

      - name: Upload Error Log
        if: ${{ always() && steps.pipe.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: erro-log
          path: ERRO_CRIPTOGRAFIA.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload artefacto encriptado
        id: up
        if: ${{ steps.pipe.outputs.encrypted_path != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ github.workspace }}/${{ steps.pipe.outputs.encrypted_path }}
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error

      # Sincronizar *antes* de alterar backup_dr_history.json. Um pull --rebase *depois* do append
      # com --autostash deixa o mesmo ficheiro em conflito (needs merge) quando vários workflows
      # tocam na telemetria — git-auto-commit falha com "resolve your current index first".
      - name: Sincronizar clone com origin (antes da telemetria)
        if: always()
        run: |
          set -euo pipefail
          BR="${{ inputs.telemetry_git_branch }}"
          git fetch origin "$BR"
          git pull --rebase origin "$BR"

      - name: Telemetria + persistência JSON
        if: always()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          ENC="${{ steps.pipe.outputs.encrypted_path }}"
          if [ -z "$ENC" ]; then
            export TELEMETRY_UPLOAD_OK=""
          elif [ "${{ steps.up.outcome }}" = "success" ]; then
            export TELEMETRY_UPLOAD_OK=1
          else
            export TELEMETRY_UPLOAD_OK=0
          fi
          python scripts/e17_1_telemetry.py append-backup

      - name: Commit backup_dr_history.json → branch de governança
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: ${{ inputs.telemetry_git_branch }}
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "chore(telemetry): backup ${{ inputs.artifact_name }} run ${{ github.run_id }}"
          file_pattern: docs/governanca/telemetry/backup_dr_history.json

      - name: Gate — pipeline, ficheiro BEA1 e upload obrigatórios
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.pipe.outcome }}" != "success" ]; then
            echo "::error::Pipeline backup + encriptação falhou (ver passo «Pipeline backup + encriptação» e gha_backup_state.json)."
            exit 1
          fi
          ENC="${{ steps.pipe.outputs.encrypted_path }}"
          if [ -z "$ENC" ]; then
            echo "::error::encrypted_path vazio — configure o secret BEABA_BACKUP_KEY no repositório ou corrija o job de backup."
            exit 1
          fi
          F="$GITHUB_WORKSPACE/$ENC"
          if [ ! -f "$F" ]; then
            echo "::error::Ficheiro encriptado ausente: $F"
            exit 1
          fi
          python3 -c "import pathlib,sys; b=pathlib.Path(sys.argv[1]).read_bytes()[:4]; assert b==b'BEA1', b" "$F" || { echo "::error::Header mágico BEA1 ausente"; exit 1; }
          if [ "${{ steps.up.outcome }}" != "success" ]; then
            echo "::error::Upload do artefacto falhou (actions/upload-artifact)."
            exit 1
          fi
          echo "OK — pipeline, BEA1 no disco e artefacto publicado."

      - name: Prova — HEAD em origin/${{ inputs.telemetry_git_branch }}
        if: success()
        run: |
          set -eux
          BRANCH="${{ inputs.telemetry_git_branch }}"
          git fetch origin "$BRANCH"
          echo "BEABA_TELEMETRY_BRANCH=$BRANCH (git pull origin $BRANCH no PC local)"
          git log -1 --format='%H %h %s (%an)' "origin/$BRANCH"
