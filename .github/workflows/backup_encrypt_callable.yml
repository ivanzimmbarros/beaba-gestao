# E17.2 — Workflow reutilizável: backup SQLite + encriptação + telemetria + commit na branch-alvo.
# Chamado por backup_hourly / backup_daily / backup_weekly (cada um define target_branch + artefacto).
#
# Cada combinação (develop | staging | main) tem cópia de código, telemetria e commit na **mesma**
# branch — rastreio independente em docs/governanca/telemetry/backup_dr_history.json por branch.
#
# Secret obrigatório: BEABA_BACKUP_KEY — base64 32 bytes ou hex 64. Sem secret, encrypted_path vazio e o gate falha.

on:
  workflow_call:
    inputs:
      environment_name:
        description: "GitHub Environment (production|staging|develop) alinhado à branch-alvo."
        required: false
        type: string
        default: develop
      target_branch:
        description: "Branch do checkout, backup e commit de telemetria (develop | staging | main)."
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      retention_days:
        required: true
        type: number
      retention_label:
        required: true
        type: string
    secrets:
      BEABA_BACKUP_KEY:
        required: true

permissions:
  contents: write
  actions: write

jobs:
  backup:
    concurrency:
      group: beaba-e17-telemetry-push-${{ github.repository }}-${{ inputs.target_branch }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name || 'develop' }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
      actions: write
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}
      BEABA_REPO_ROOT: ${{ github.workspace }}
      BEABA_BACKUP_CLOUD_QUEUE: "0"
      BEABA_BACKUP_KEEP: "50"
      BEABA_CI_PREPARE_EMPTY_DB: "1"
      BEABA_GHA_RETENTION_LABEL: ${{ inputs.retention_label }}
      BEABA_GHA_ARTIFACT_NAME: ${{ inputs.artifact_name }}
      BEABA_GHA_TARGET_BRANCH: ${{ inputs.target_branch }}
      BEABA_BACKUP_KEY: ${{ secrets.BEABA_BACKUP_KEY }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}

    steps:
      - name: Checkout código na branch-alvo (${{ inputs.target_branch }})
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Contexto e rastreio (origem das mensagens)
        run: |
          set -euo pipefail
          SUMMARY_FILE="${GITHUB_STEP_SUMMARY:-}"
          {
            echo "## Backup E17 — contexto do job"
            echo ""
            echo "| Campo | Valor |"
            echo "|--|--|"
            echo "| **Origem** | passo «Contexto e rastreio» em \`backup_encrypt_callable.yml\` |"
            echo "| **Workflow chamador** | \`$GITHUB_WORKFLOW\` (#$GITHUB_RUN_ID) |"
            echo "| **Branch-alvo** | \`${{ inputs.target_branch }}\` (código + telemetria no mesmo ref) |"
            echo "| **GitHub Environment** | \`${{ inputs.environment_name }}\` |"
            echo "| **Artefacto** | \`${{ inputs.artifact_name }}\` |"
            echo "| **Retenção** | ${{ inputs.retention_label }} (${{ inputs.retention_days }}d) |"
            echo ""
          } >> "${SUMMARY_FILE}"
          echo "::notice title=Backup E17 [${{ inputs.target_branch }}]::workflow=$GITHUB_WORKFLOW run=$GITHUB_RUN_ID artefact=${{ inputs.artifact_name }} env=${{ inputs.environment_name }}"

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: pip install -r requirements.txt

      - name: Pipeline backup + encriptação
        id: pipe
        continue-on-error: false
        run: python scripts/e17_1_gha_backup_job.py

      - name: Upload Error Log
        if: ${{ always() && steps.pipe.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: erro-log-${{ inputs.target_branch }}
          path: ERRO_CRIPTOGRAFIA.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload artefacto encriptado
        id: up
        if: ${{ steps.pipe.outputs.encrypted_path != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ github.workspace }}/${{ steps.pipe.outputs.encrypted_path }}
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error

      - name: Sincronizar com origin (antes da telemetria)
        if: always()
        run: |
          set -euo pipefail
          BR="${{ inputs.target_branch }}"
          git fetch origin "$BR"
          git pull --rebase origin "$BR"

      - name: Telemetria + persistência JSON
        if: always()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          ENC="${{ steps.pipe.outputs.encrypted_path }}"
          if [ -z "$ENC" ]; then
            export TELEMETRY_UPLOAD_OK=""
          elif [ "${{ steps.up.outcome }}" = "success" ]; then
            export TELEMETRY_UPLOAD_OK=1
          else
            export TELEMETRY_UPLOAD_OK=0
          fi
          python scripts/e17_1_telemetry.py append-backup

      - name: Commit backup_dr_history.json → branch ${{ inputs.target_branch }}
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: ${{ inputs.target_branch }}
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "chore(telemetry): backup ${{ inputs.artifact_name }} [${{ inputs.target_branch }}] run ${{ github.run_id }}"
          file_pattern: docs/governanca/telemetry/backup_dr_history.json

      - name: Gate — pipeline, ficheiro BEA1 e upload obrigatórios
        if: always()
        run: |
          set -euo pipefail
          B="${{ inputs.target_branch }}"
          if [ "${{ steps.pipe.outcome }}" != "success" ]; then
            echo "::error title=Gate backup [$B]::[backup_encrypt_callable / Gate] Pipeline backup + encriptação falhou — ver log do passo «Pipeline backup + encriptação» e gha_backup_state.json na branch $B."
            exit 1
          fi
          ENC="${{ steps.pipe.outputs.encrypted_path }}"
          if [ -z "$ENC" ]; then
            echo "::error title=Gate backup [$B]::[backup_encrypt_callable / Gate] encrypted_path vazio — secret BEABA_BACKUP_KEY ou pipeline na branch $B."
            exit 1
          fi
          F="$GITHUB_WORKSPACE/$ENC"
          if [ ! -f "$F" ]; then
            echo "::error title=Gate backup [$B]::[backup_encrypt_callable / Gate] Ficheiro encriptado ausente: $F"
            exit 1
          fi
          if ! python3 -c "import pathlib,sys; b=pathlib.Path(sys.argv[1]).read_bytes()[:4]; assert b==b'BEA1', b" "$F"; then
            echo "::error title=Gate backup [$B]::[backup_encrypt_callable / Gate] Header mágico BEA1 ausente em $F"
            exit 1
          fi
          if [ "${{ steps.up.outcome }}" != "success" ]; then
            echo "::error title=Gate backup [$B]::[backup_encrypt_callable / Gate] Upload do artefacto falhou (actions/upload-artifact)."
            exit 1
          fi
          echo "::notice title=Gate OK [$B]::[backup_encrypt_callable / Gate] Pipeline, BEA1 válido e artefacto publicado para branch $B."

      - name: Prova — HEAD em origin/${{ inputs.target_branch }}
        if: success()
        run: |
          set -eux
          BRANCH="${{ inputs.target_branch }}"
          git fetch origin "$BRANCH"
          echo "::notice title=Telemetria [$BRANCH]::Último commit em origin/$BRANCH (Monitor: git pull origin $BRANCH)"
          git log -1 --format='%H %h %s (%an)' "origin/$BRANCH"
