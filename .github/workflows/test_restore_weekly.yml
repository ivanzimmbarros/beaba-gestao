# E17.2 — Teste de restore (domingo 04:00 UTC): matriz develop / staging / main — cascata weekly → daily → hourly por branch.
# Código: branch backup-and-restore. Artefactos: sufixo -<branch> (alinhado aos backups).

name: test_restore_weekly

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      artifact_source_branch:
        description: "Ref dos artefactos (vazio = igual à branch da célula da matriz)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  test-restore:
    concurrency:
      group: beaba-test-restore-${{ matrix.source_branch }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - source_branch: develop
            environment_name: develop
          - source_branch: staging
            environment_name: staging
          - source_branch: main
            environment_name: production
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment_name }}
    env:
      PYTHONPATH: ${{ github.workspace }}
      BEABA_REPO_ROOT: ${{ github.workspace }}

    steps:
      - name: Contexto teste restore
        run: |
          {
            echo "## Teste restore — contexto [${{ matrix.source_branch }}]"
            echo ""
            echo "| Campo | Valor |"
            echo "|--|--|"
            echo "| **Origem** | \`test_restore_weekly.yml\` |"
            echo "| **Branch dos artefactos** | \`${{ github.event.inputs.artifact_source_branch || matrix.source_branch }}\` |"
            echo "| **Código** | branch \`backup-and-restore\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Test restore [${{ matrix.source_branch }}]::origem=test_restore_weekly.yml"

      - name: Checkout backup-and-restore
        uses: actions/checkout@v4
        with:
          ref: backup-and-restore
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: pip install -r requirements.txt

      - name: Hora UTC (relatório)
        id: ts
        run: |
          echo "utc=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"
          echo "dia_hora=$(date -u +'%d/%m/%Y às %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Artefacto DB_WEEKLY_BACKUP-${{ matrix.source_branch }}
        id: art_w
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ github.token }}
          workflow: backup_weekly.yml
          branch: ${{ github.event.inputs.artifact_source_branch || matrix.source_branch }}
          name: DB_WEEKLY_BACKUP-${{ matrix.source_branch }}
          path: dl

      - name: Artefacto DB_DAILY_BACKUP-${{ matrix.source_branch }}
        id: art_d
        if: steps.art_w.outcome == 'failure'
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ github.token }}
          workflow: backup_daily.yml
          branch: ${{ github.event.inputs.artifact_source_branch || matrix.source_branch }}
          name: DB_DAILY_BACKUP-${{ matrix.source_branch }}
          path: dl

      - name: Artefacto backup horário
        id: art_h
        if: steps.art_w.outcome == 'failure' && steps.art_d.outcome == 'failure'
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ github.token }}
          workflow: backup_hourly.yml
          branch: ${{ github.event.inputs.artifact_source_branch || matrix.source_branch }}
          name: beaba-sqlite-backup-encrypted-${{ matrix.source_branch }}
          path: dl

      - name: Cascata — falhar só se nenhum BEA1
        id: art_ok
        continue-on-error: true
        run: |
          python << 'PY'
          import sys
          from pathlib import Path
          MAGIC = b"BEA1"
          dl = Path("dl")
          ok = False
          if dl.is_dir():
              for p in dl.rglob("*"):
                  if p.is_file() and p.stat().st_size > 20:
                      try:
                          if p.read_bytes()[:4] == MAGIC:
                              ok = True
                              break
                      except OSError:
                          pass
          if not ok:
              print("::error title=Cascata [${{ matrix.source_branch }}]::[test_restore_weekly] Nenhum ficheiro BEA1 após weekly → daily → horário (branch ${{ matrix.source_branch }}).")
              sys.exit(1)
          print("::notice title=Cascata OK [${{ matrix.source_branch }}]::Artefacto encriptado encontrado em dl/")
          PY

      - name: Restore + validar (restore_sqlite.py)
        id: rst
        if: steps.art_ok.outcome == 'success'
        continue-on-error: true
        env:
          BEABA_BACKUP_KEY: ${{ secrets.BEABA_BACKUP_KEY }}
          # Rastreio lógico (telemetria / relatórios); não substituir GITHUB_REF_NAME — restore_sqlite exige branch backup-and-restore ou git HEAD.
          BEABA_GHA_TARGET_BRANCH: ${{ matrix.source_branch }}
        run: python scripts/restore_sqlite.py dl

      - name: Resumo para e-mail (sucesso)
        if: steps.rst.outcome == 'success'
        id: oksum
        run: |
          python << 'PY'
          import json
          from pathlib import Path
          p = Path("restore_result.json")
          d = json.loads(p.read_text(encoding="utf-8")) if p.is_file() else {}
          tc = d.get("table_counts") or {}
          pct = d.get("consistency_success_pct")
          lines = [
              f"Branch testada: ${{ matrix.source_branch }}",
              f"Origem da mensagem: test_restore_weekly.yml (job test-restore, matriz)",
              "",
              "Contagem de registros (tabelas principais):",
              json.dumps(tc, ensure_ascii=False, indent=2),
              "",
              f"Validação de integridade (vs telemetria do último backup): {pct}%",
              f"PRAGMA integrity_check: {d.get('integrity_check')} | FK violations: {d.get('foreign_key_violations')}",
          ]
          Path("email_ok_body.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: E-mail — sucesso
        if: steps.rst.outcome == 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "(Sucesso) Teste Restore BeaBa [${{ matrix.source_branch }}] — ${{ steps.ts.outputs.dia_hora }}"
          to: ivanzimmbarros@gmail.com
          from: ${{ secrets.EMAIL_FROM }}
          body: file://email_ok_body.txt
          attachments: restore_result.json

      - name: Corpo e-mail — falha
        if: always() && (steps.art_ok.outcome == 'failure' || steps.rst.outcome == 'failure')
        run: |
          {
            echo "Branch: ${{ matrix.source_branch }}"
            echo "Origem: test_restore_weekly.yml (notify automático)"
            echo "Motivo:"
            if [ "${{ steps.art_ok.outcome }}" = "failure" ]; then
              echo "  Cascata sem ficheiro BEA1 (weekly/daily/hourly) para esta branch — ver nomes DB_WEEKLY_BACKUP-${{ matrix.source_branch }}, etc."
            else
              echo "  restore_sqlite.py ou validação falhou."
            fi
            echo "Hora: ${{ steps.ts.outputs.utc }}"
            echo "Download weekly: ${{ steps.art_w.outcome }} | daily: ${{ steps.art_d.outcome }} | hourly: ${{ steps.art_h.outcome }}"
            echo "Log / run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "--- restore_result.json (se existir) ---"
            cat restore_result.json 2>/dev/null || true
          } > email_fail_body.txt

      - name: E-mail — falha
        if: always() && (steps.art_ok.outcome == 'failure' || steps.rst.outcome == 'failure')
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "(Atenção) Falha Teste Restore BeaBa [${{ matrix.source_branch }}]"
          to: ivanzimmbarros@gmail.com
          from: ${{ secrets.EMAIL_FROM }}
          body: file://email_fail_body.txt

      - name: Estado final do job
        if: always()
        run: |
          if [ "${{ steps.art_ok.outcome }}" != "success" ]; then
            echo "::error title=Test restore [${{ matrix.source_branch }}]::[test_restore_weekly] Cascata sem artefacto válido."
            exit 1
          fi
          if [ "${{ steps.rst.outcome }}" != "success" ]; then
            echo "::error title=Test restore [${{ matrix.source_branch }}]::[test_restore_weekly] restore_sqlite.py falhou."
            exit 1
          fi
