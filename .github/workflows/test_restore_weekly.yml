# E17.2 — Teste semanal de restore (domingo 04:00 UTC): **três jobs independentes** (develop / staging / main).
#
# Contrato obrigatório:
# - **Dados** (ficheiros BEA1): originam dos pipelines de backup da ref indicada (weekly → daily → hourly em cascata).
# - **Execução do restore**: **apenas** na branch `backup-and-restore` (`scripts/restore_sqlite.py`, requirements, telemetria de referência nesta árvore).
# - **Rastreio**: sumário, notices, restore_result.json (bloco restore_audit), e-mails com origem dos dados, commit do kit, run URL, conclusão.
#
# O ficheiro deve existir em `backup-and-restore` e em **default branch** se usar `schedule`.

name: test_restore_weekly

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      artifact_source_branch:
        description: "Ref GitHub a usar no download de artefactos (vazio = célula da matriz)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  test-restore:
    concurrency:
      group: beaba-test-restore-${{ matrix.source_branch }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - source_branch: develop
            environment_name: develop
          - source_branch: staging
            environment_name: staging
          - source_branch: main
            environment_name: production
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment_name }}
    env:
      PYTHONPATH: ${{ github.workspace }}
      BEABA_REPO_ROOT: ${{ github.workspace }}
      ARTIFACT_REF: ${{ github.event.inputs.artifact_source_branch || matrix.source_branch }}

    steps:
      - name: Checkout obrigatório — backup-and-restore (único código do restore)
        uses: actions/checkout@v4
        with:
          ref: backup-and-restore
          fetch-depth: 0

      - name: Identificação do kit de restore (commit em execução)
        id: gitref
        run: |
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "full=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "::notice title=[test_restore_weekly] Kit código::branch=backup-and-restore sha=$(git rev-parse --short HEAD) matrix_data_ref=${{ matrix.source_branch }}"

      - name: Bloco inicial — rastreio (sumário)
        run: |
          {
            echo "## Restore semanal — célula \`${{ matrix.source_branch }}\` (GitHub Environment: ${{ matrix.environment_name }})"
            echo ""
            echo "### Política"
            echo "- **Origem dos dados (backups):** ref \`${{ env.ARTIFACT_REF }}\` (jobs backup_hourly / daily / weekly dessa ref)."
            echo "- **Código do teste de restore:** **só** branch \`backup-and-restore\` @ ${SHORT} (não há checkout de develop/staging/main)."
            echo "- **Workflow:** \`test_restore_weekly.yml\` · **Run:** ${{ github.run_id }} · **Repo:** ${{ github.repository }}"
            echo ""
            echo "### Links"
            echo "- [Este job no Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          SHORT: ${{ steps.gitref.outputs.short }}

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências (requirements da backup-and-restore)
        run: pip install -r requirements.txt

      - name: Hora UTC (relatórios e e-mail)
        id: ts
        run: |
          echo "utc=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"
          echo "dia_hora=$(date -u +'%d/%m/%Y às %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: "Cascata [1/3] artefacto weekly: DB_WEEKLY_BACKUP-${{ matrix.source_branch }}"
        id: art_w
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ github.token }}
          workflow: backup_weekly.yml
          branch: ${{ env.ARTIFACT_REF }}
          name: DB_WEEKLY_BACKUP-${{ matrix.source_branch }}
          path: dl

      - name: "Cascata [2/3] artefacto daily: DB_DAILY_BACKUP-${{ matrix.source_branch }}"
        id: art_d
        if: steps.art_w.outcome == 'failure'
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ github.token }}
          workflow: backup_daily.yml
          branch: ${{ env.ARTIFACT_REF }}
          name: DB_DAILY_BACKUP-${{ matrix.source_branch }}
          path: dl

      - name: "Cascata [3/3] artefacto hourly: beaba-sqlite-backup-encrypted-${{ matrix.source_branch }}"
        id: art_h
        if: steps.art_w.outcome == 'failure' && steps.art_d.outcome == 'failure'
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ github.token }}
          workflow: backup_hourly.yml
          branch: ${{ env.ARTIFACT_REF }}
          name: beaba-sqlite-backup-encrypted-${{ matrix.source_branch }}
          path: dl

      - name: Qual tier da cascata forneceu o BEA1
        id: tier
        if: always()
        run: |
          {
            echo "### Cascata — resultado por tier"
            echo ""
            echo "| Tier | Workflow fonte | Download |"
            echo "|--|--|--|"
            echo "| weekly | \`backup_weekly.yml\` | ${{ steps.art_w.outcome }} |"
            echo "| daily | \`backup_daily.yml\` | ${{ steps.art_d.outcome }} |"
            echo "| hourly | \`backup_hourly.yml\` | ${{ steps.art_h.outcome }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validar presença de ficheiro BEA1 em dl/
        id: art_ok
        continue-on-error: true
        run: |
          python << 'PY'
          import sys
          from pathlib import Path
          MAGIC = b"BEA1"
          dl = Path("dl")
          ok = False
          if dl.is_dir():
              for p in dl.rglob("*"):
                  if p.is_file() and p.stat().st_size > 20:
                      try:
                          if p.read_bytes()[:4] == MAGIC:
                              ok = True
                              break
                      except OSError:
                          pass
          if not ok:
              print("::error title=[test_restore_weekly] Sem BEA1 [dados ${{ matrix.source_branch }}]::Cascata weekly→daily→hourly falhou para ref ${{ env.ARTIFACT_REF }}. Ver backups nessa ref.")
              sys.exit(1)
          # tier lógico
          import os
          wo, do_, ho = os.environ.get("W",""), os.environ.get("D",""), os.environ.get("H","")
          if wo == "success":
              tier = "weekly (DB_WEEKLY_BACKUP-${{ matrix.source_branch }})"
          elif do_ == "success":
              tier = "daily (DB_DAILY_BACKUP-${{ matrix.source_branch }})"
          else:
              tier = "hourly (beaba-sqlite-backup-encrypted-${{ matrix.source_branch }})"
          print(f"::notice title=BEA1 OK [${{ matrix.source_branch }}]::tier_escolhido={tier}")
          PY
        env:
          W: ${{ steps.art_w.outcome }}
          D: ${{ steps.art_d.outcome }}
          H: ${{ steps.art_h.outcome }}

      - name: Registar tier usado (evolução)
        id: tier_pick
        if: steps.art_ok.outcome == 'success'
        run: |
          if [ "${{ steps.art_w.outcome }}" = "success" ]; then
            echo "label=weekly" >> "$GITHUB_OUTPUT"
            echo "artifact_name=DB_WEEKLY_BACKUP-${{ matrix.source_branch }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.art_d.outcome }}" = "success" ]; then
            echo "label=daily" >> "$GITHUB_OUTPUT"
            echo "artifact_name=DB_DAILY_BACKUP-${{ matrix.source_branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "label=hourly" >> "$GITHUB_OUTPUT"
            echo "artifact_name=beaba-sqlite-backup-encrypted-${{ matrix.source_branch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Sumário — artefacto seleccionado pela cascata
        if: steps.tier_pick.outcome == 'success'
        run: |
          {
            echo "### Artefacto utilizado no restore"
            echo ""
            echo "- **Dados (ref GitHub do download):** \`${{ env.ARTIFACT_REF }}\`"
            echo "- **Tier:** ${{ steps.tier_pick.outputs.label }}"
            echo "- **Nome do artefacto:** \`${{ steps.tier_pick.outputs.artifact_name }}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore + validar — apenas código backup-and-restore
        id: rst
        if: steps.art_ok.outcome == 'success'
        continue-on-error: true
        env:
          BEABA_BACKUP_KEY: ${{ secrets.BEABA_BACKUP_KEY }}
          BEABA_GHA_TARGET_BRANCH: ${{ matrix.source_branch }}
          BEABA_GHA_RESTORE_KIT_BRANCH: backup-and-restore
          BEABA_GHA_RESTORE_KIT_SHA_SHORT: ${{ steps.gitref.outputs.short }}
          BEABA_GHA_RESTORE_KIT_SHA_FULL: ${{ steps.gitref.outputs.full }}
          BEABA_GHA_RESTORE_TEST_WORKFLOW: test_restore_weekly.yml
        run: |
          python scripts/restore_sqlite.py dl

      - name: Conclusão no sumário (sucesso ou falha do restore)
        if: always()
        run: |
          {
            echo "### Conclusão restore_sqlite"
            echo ""
            echo "| Campo | Valor |"
            echo "|--|--|"
            echo "| **Estado** | ${{ steps.rst.outcome }} |"
            echo "| **Dados testados (ref backup)** | ${{ matrix.source_branch }} |"
            echo "| **Código em execução** | backup-and-restore @ ${{ steps.gitref.outputs.short }} |"
            echo "| **Tier dados** | ${{ steps.tier_pick.outputs.label != '' && steps.tier_pick.outputs.label || 'n/a' }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.rst.outcome }}" = "success" ]; then
            echo "::notice title=[test_restore_weekly] Conclusão [${{ matrix.source_branch }}]::restore_sqlite=SUCESSO kit=${{ steps.gitref.outputs.short }}"
          else
            echo "::error title=[test_restore_weekly] Conclusão [${{ matrix.source_branch }}]::restore_sqlite=FALHOU ou omitido — ver passo e restore_result.json"
          fi

      - name: Corpo e-mail — sucesso
        if: steps.rst.outcome == 'success'
        run: |
          python << 'PY'
          import html as html_lib
          import json
          from pathlib import Path

          matrix_branch = "${{ matrix.source_branch }}"
          matrix_env = "${{ matrix.environment_name }}"
          utc = "${{ steps.ts.outputs.utc }}"
          run_url = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          run_id = "${{ github.run_id }}"
          artifact_ref = "${{ env.ARTIFACT_REF }}"
          tier = "${{ steps.tier_pick.outputs.label }}"
          artifact_name = "${{ steps.tier_pick.outputs.artifact_name }}"
          git_short = "${{ steps.gitref.outputs.short }}"
          git_full = "${{ steps.gitref.outputs.full }}"

          p = Path("restore_result.json")
          d = json.loads(p.read_text(encoding="utf-8")) if p.is_file() else {}
          aud = d.get("restore_audit") or {}
          tc = d.get("table_counts") or {}
          pct = d.get("consistency_success_pct")

          h = html_lib.escape

          plain = [
              "======================================================================",
              "  ✅ SUCESSO  |  Teste semanal de RESTORE (BeaBa)",
              "======================================================================",
              "",
              "  Operação.................: Teste de restore (BEA1 → SQLite)",
              "  Resultado visual.........: SUCESSO",
              f"  Branch dos dados.........: {matrix_branch}",
              f"  Branch do código.........: backup-and-restore @ {git_short}",
              f"  Tier da cascata..........: {tier or 'n/a'}",
              f"  Momento (UTC)............: {utc}",
              "",
              "  Esta célula concluiu a recuperação de prova com sucesso.",
              "",
              "--- Detalhes técnicos --------------------------------------------------",
              f"GitHub Environment.........: {matrix_env}",
              f"Run URL....................: {run_url}",
              f"Run ID.....................: {run_id}",
              "",
              "Origem dos dados:",
              f"  Ref download .............: {artifact_ref}",
              f"  Artefacto................: {artifact_name}",
              "",
              "restore_audit:",
              json.dumps(aud, ensure_ascii=False, indent=2) if aud else "  (sem bloco — ver anexo JSON)",
              "",
              "Contagens:",
              json.dumps(tc, ensure_ascii=False, indent=2),
              "",
              f"Integridade SQLite: PRAGMA={d.get('integrity_check')} | FK={d.get('foreign_key_violations')}",
              f"Consistência vs telemetria (backup-and-restore): {pct}%",
              f"Commit kit (completo)......: {git_full}",
              "",
          ]
          Path("email_ok_body.txt").write_text("\n".join(plain) + "\n", encoding="utf-8")

          aud_txt = json.dumps(aud, ensure_ascii=False, indent=2) if aud else "{}"
          tc_txt = json.dumps(tc, ensure_ascii=False, indent=2)
          html_doc = f"""<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8"></head>
<body style="font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:15px;color:#1f2937;">
  <div style="background:#ecfdf5;border-left:8px solid #16a34a;padding:16px 18px;margin:0 0 20px 0;border-radius:4px;">
    <div style="font-size:28px;line-height:1.2;margin-bottom:10px;"><span style="color:#16a34a;">&#9989;</span>
      <span style="font-weight:bold;color:#15803d;vertical-align:middle;">SUCESSO</span></div>
    <div style="font-size:17px;margin-bottom:14px;font-weight:600;">Teste semanal de restore (BeaBa)</div>
    <table cellpadding="6" cellspacing="0" style="border-collapse:collapse;">
      <tr><td style="color:#6b7280;vertical-align:top;">Operação</td><td>Restore de prova (BEA1)</td></tr>
      <tr><td style="color:#6b7280;">Resultado</td><td><strong style="color:#15803d;">SUCESSO</strong></td></tr>
      <tr><td style="color:#6b7280;">Branch dos dados</td><td><strong>{h(matrix_branch)}</strong></td></tr>
      <tr><td style="color:#6b7280;">Código</td><td><code>backup-and-restore @ {h(git_short)}</code></td></tr>
      <tr><td style="color:#6b7280;">Tier</td><td><strong>{h(tier or "n/a")}</strong> — <code>{h(artifact_name)}</code></td></tr>
      <tr><td style="color:#6b7280;">Data/hora UTC</td><td><strong>{h(utc)}</strong></td></tr>
      <tr><td style="color:#6b7280;">Run</td><td><a href="{h(run_url)}" style="color:#2563eb;">Abrir no GitHub Actions</a></td></tr>
    </table>
  </div>
  <h3 style="color:#374151;margin-top:0;">Detalhes técnicos</h3>
  <p style="color:#6b7280;font-size:13px;">Environment: {h(matrix_env)} · Ref download: {h(artifact_ref)}</p>
  <p><strong>restore_audit</strong></p>
  <pre style="background:#f9fafb;padding:12px;border-radius:4px;overflow:auto;font-size:12px;line-height:1.35;">{h(aud_txt)}</pre>
  <p><strong>Contagens</strong></p>
  <pre style="background:#f9fafb;padding:12px;border-radius:4px;overflow:auto;font-size:12px;line-height:1.35;">{h(tc_txt)}</pre>
  <p style="color:#374151;">SQLite PRAGMA={h(str(d.get("integrity_check")))} · FK={h(str(d.get("foreign_key_violations")))} · Consistência={h(str(pct))}%</p>
</body></html>"""
          Path("email_ok_body.html").write_text(html_doc, encoding="utf-8")
          PY

      - name: E-mail — sucesso
        if: steps.rst.outcome == 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ SUCESSO | Teste restore semanal | dados ${{ matrix.source_branch }} | ${{ steps.ts.outputs.utc }}"
          to: ivanzimmbarros@gmail.com
          from: ${{ secrets.EMAIL_FROM }}
          body: file://email_ok_body.txt
          html_body: file://email_ok_body.html
          attachments: restore_result.json

      - name: Corpo e-mail — falha
        if: always() && (steps.art_ok.outcome == 'failure' || steps.rst.outcome == 'failure')
        run: |
          python << 'PY'
          import html as html_lib
          import json
          from pathlib import Path

          matrix_branch = "${{ matrix.source_branch }}"
          matrix_env = "${{ matrix.environment_name }}"
          utc = "${{ steps.ts.outputs.utc }}"
          run_url = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          run_id = "${{ github.run_id }}"
          artifact_ref = "${{ env.ARTIFACT_REF }}"
          git_short = "${{ steps.gitref.outputs.short }}"
          git_full = "${{ steps.gitref.outputs.full }}"
          art_ok = "${{ steps.art_ok.outcome }}"
          rst = "${{ steps.rst.outcome }}"
          w_o = "${{ steps.art_w.outcome }}"
          d_o = "${{ steps.art_d.outcome }}"
          h_o = "${{ steps.art_h.outcome }}"
          tier = "${{ steps.tier_pick.outputs.label }}"
          artifact_name = "${{ steps.tier_pick.outputs.artifact_name }}"

          h = html_lib.escape

          p = Path("restore_result.json")
          extra_plain = "(ficheiro ausente)"
          extra_json_txt = "{}"
          if p.is_file():
              try:
                  d_fail = json.loads(p.read_text(encoding="utf-8"))
                  extra_plain = json.dumps(d_fail, ensure_ascii=False, indent=2)
                  extra_json_txt = extra_plain
              except Exception:
                  extra_plain = p.read_text(encoding="utf-8", errors="replace")
                  extra_json_txt = extra_plain

          if art_ok == "failure":
              diag = "Sem ficheiro BEA1 após cascata weekly → daily → hourly (verifique backups na ref)."
          else:
              diag = "restore_sqlite.py ou validação falhou — ver logs do passo «Restore + validar» e JSON."

          plain = [
              "======================================================================",
              "  🔴 FALHA  |  Teste semanal de RESTORE (BeaBa)",
              "======================================================================",
              "",
              "  Operação.................: Teste de restore (BEA1)",
              "  Resultado visual.........: FALHA",
              f"  Branch dos dados.........: {matrix_branch}",
              f"  Branch do código.........: backup-and-restore @ {git_short}",
              f"  Momento (UTC)............: {utc}",
              "",
              f"  Diagnóstico..............: {diag}",
              "",
              "--- Cascata de downloads ----------------------------------------------",
              f"  weekly : {w_o}",
              f"  daily  : {d_o}",
              f"  hourly : {h_o}",
              "",
              "--- Detalhes técnicos --------------------------------------------------",
              f"GitHub Environment.........: {matrix_env}",
              f"Run URL....................: {run_url}",
              f"Run ID.....................: {run_id}",
              f"Ref download artefactos....: {artifact_ref}",
              f"Tier / artefacto (se aplicável): {tier or 'n/a'} / {artifact_name}",
              f"art_ok step................: {art_ok} | restore step: {rst}",
              f"Kit commit completo........: {git_full}",
              "",
              "--- restore_result.json (se existir) ---",
              extra_plain,
              "",
          ]
          Path("email_fail_body.txt").write_text("\n".join(plain) + "\n", encoding="utf-8")

          html_doc = f"""<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8"></head>
<body style="font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:15px;color:#1f2937;">
  <div style="background:#fef2f2;border-left:8px solid #dc2626;padding:16px 18px;margin:0 0 20px 0;border-radius:4px;">
    <div style="font-size:28px;line-height:1.2;margin-bottom:10px;"><span style="color:#dc2626;font-weight:bold;">&#128308;</span>
      <span style="font-weight:bold;color:#991b1b;vertical-align:middle;">FALHA</span></div>
    <div style="font-size:17px;margin-bottom:14px;font-weight:600;">Teste semanal de restore (BeaBa)</div>
    <table cellpadding="6" cellspacing="0" style="border-collapse:collapse;">
      <tr><td style="color:#6b7280;">Resultado</td><td><strong style="color:#b91c1c;">FALHA</strong></td></tr>
      <tr><td style="color:#6b7280;">Branch dos dados</td><td><strong>{h(matrix_branch)}</strong></td></tr>
      <tr><td style="color:#6b7280;">Código</td><td><code>backup-and-restore @ {h(git_short)}</code></td></tr>
      <tr><td style="color:#6b7280;">Data/hora UTC</td><td><strong>{h(utc)}</strong></td></tr>
      <tr><td style="color:#6b7280;">Run</td><td><a href="{h(run_url)}" style="color:#2563eb;">GitHub Actions</a></td></tr>
      <tr><td style="color:#6b7280;vertical-align:top;">Diagnóstico</td><td>{h(diag)}</td></tr>
    </table>
    <p style="margin-top:14px;color:#991b1b;font-size:14px;"><strong>Cascata:</strong>
      weekly=<code>{h(w_o)}</code> · daily=<code>{h(d_o)}</code> · hourly=<code>{h(h_o)}</code></p>
  </div>
  <h3 style="color:#374151;margin-top:0;">Detalhes técnicos</h3>
  <p style="color:#6b7280;font-size:13px;">Environment: {h(matrix_env)} · Ref download: {h(artifact_ref)} · art_ok={h(art_ok)} restore={h(rst)}</p>
  <pre style="background:#f9fafb;padding:12px;border-radius:4px;overflow:auto;font-size:12px;max-height:480px;">{h(extra_json_txt if len(extra_json_txt) < 120000 else extra_json_txt[:120000] + "...")}</pre>
</body></html>"""
          Path("email_fail_body.html").write_text(html_doc, encoding="utf-8")
          PY

      - name: E-mail — falha
        if: always() && (steps.art_ok.outcome == 'failure' || steps.rst.outcome == 'failure')
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🔴 FALHA | Teste restore semanal | dados ${{ matrix.source_branch }} | ${{ steps.ts.outputs.utc }}"
          to: ivanzimmbarros@gmail.com
          from: ${{ secrets.EMAIL_FROM }}
          body: file://email_fail_body.txt
          html_body: file://email_fail_body.html
