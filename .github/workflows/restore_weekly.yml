# E17.1 — Restore de prova semanal (domingo 03:00 UTC): último artefacto de backup_hourly, decrypt, verify, telemetria + commit.
# Requer Secret: BEABA_BACKUP_KEY (igual ao workflow de backup).
#
# Branch dos artefactos: os backups agendados (cron) executam na branch por defeito do repo (normalmente main).
# O download DEVE usar essa branch — «develop» não encontra artefactos dos crons e falha o restore.

name: restore_weekly

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      artifact_source_branch:
        description: "Branch em que o backup_hourly agendado corre (defeito main)"
        required: false
        default: "main"

concurrency:
  group: beaba-restore-telemetry-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  restore:
    concurrency:
      group: beaba-e17-telemetry-push-${{ github.repository }}-develop
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: ${{ (github.ref_name == 'main' && 'production') || (github.ref_name == 'staging' && 'staging') || 'develop' }}
    env:
      PYTHONPATH: ${{ github.workspace }}
      BEABA_REPO_ROOT: ${{ github.workspace }}

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: pip install -r requirements.txt

      - name: Descarregar último backup encriptado
        id: dl
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ github.token }}
          workflow: backup_hourly.yml
          branch: ${{ github.event.inputs.artifact_source_branch || 'main' }}
          name: beaba-sqlite-backup-encrypted
          path: dl

      - name: Restore de prova + evidências
        id: restore
        continue-on-error: true
        env:
          BEABA_BACKUP_KEY: ${{ secrets.BEABA_BACKUP_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: python scripts/e17_1_gha_restore_job.py

      - name: Sincronizar clone com origin (antes da telemetria)
        if: always()
        run: |
          set -euo pipefail
          git fetch origin develop
          git pull --rebase origin develop

      - name: Telemetria restore
        if: always()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: python scripts/e17_1_telemetry.py append-restore

      - name: Commit backup_dr_history.json
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: develop
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "chore(telemetry): restore weekly run ${{ github.run_id }}"
          file_pattern: docs/governanca/telemetry/backup_dr_history.json
